<div class="widget" id="searchbox" role="search" aria-label="{{ _('Site search') }}">
    <h2><a href="#searchbox">{{ _('Search') }}</a></h2>
    <form action="{{ pathto('search') }}" method="get">
        <input type="text" name="q" aria-label="{{ _('Search this site') }}" />
        <button type="submit" aria-label="{{ _('Search') }}" title="{{ _('Search') }}"><span class="fa fa-search" aria-hidden="true"></span></button>
    </form>
</div>
